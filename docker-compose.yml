services:
  adcraft-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adcraft-enterprise-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=adcraft-enterprise-super-secret-key-prod-2026
      - LOG_LEVEL=info
    volumes:
      - adcraft_sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health/live').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

volumes:
  adcraft_sqlite_data:
    driver: local
